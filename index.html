<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tillträde Melodigränd 6 - Nedräkning</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:linear-gradient(135deg,#0f2027,#203a43,#2c5364);color:#fff}
.card{width:100%;max-width:720px;background:rgba(255,255,255,.12);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.2);border-radius:24px;padding:36px 28px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.badge{display:inline-block;background:#ffd166;color:#1a1a1a;font-weight:700;font-size:13px;letter-spacing:.12em;text-transform:uppercase;padding:7px 14px;border-radius:999px;margin-bottom:18px}
h1{font-size:clamp(32px,6vw,52px);line-height:1.05;margin-bottom:10px}
.subtitle{opacity:.9;font-size:18px;margin-bottom:28px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:22px}
@media(max-width:560px){.grid{grid-template-columns:repeat(2,1fr)}}
.box{background:rgba(255,255,255,.14);border-radius:18px;padding:20px 10px}
.num{font-size:clamp(36px,7vw,56px);font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.label{margin-top:8px;opacity:.85;font-size:13px;letter-spacing:.14em;text-transform:uppercase}
.progress{height:10px;background:rgba(255,255,255,.2);border-radius:999px;overflow:hidden;margin:6px 0 12px}
.bar{height:100%;background:#ffd166;width:0%;transition:width .5s}
.meta{opacity:.9;font-size:15px;line-height:1.6}
.done{font-size:32px;font-weight:800}
small{opacity:.7}
</style>
</head>
<body>
<div class="card">
<div class="badge">Nedräkning</div>
<h1>Tillträde<br>Melodigränd 6</h1>
<p class="subtitle">till fredag 11 december kl 09.00</p>
<div class="grid">
<div class="box"><div class="num" id="d">--</div><div class="label">Dagar</div></div>
<div class="box"><div class="num" id="h">--</div><div class="label">Timmar</div></div>
<div class="box"><div class="num" id="m">--</div><div class="label">Minuter</div></div>
<div class="box"><div class="num" id="s">--</div><div class="label">Sekunder</div></div>
</div>
<div class="progress"><div class="bar" id="bar"></div></div>
<p class="meta" id="meta"></p>
<p style="margin-top:18px"><small>11 december 2026 kl 09.00 • Melodigränd 6</small></p>
<div id="done" style="display:none;margin-top:20px"><div class="done">Nu är det dags! 🎉</div><p>Välkommen till Melodigränd 6</p></div>
</div>
<script>
const target = new Date('2026-12-11T09:00:00+01:00');
const start = new Date('2026-11-14T00:00:00+01:00');
function pad(n){return String(n).padStart(2,'0')}
function tick(){
  const now = new Date();
  let diff = target - now;
  if(diff<=0){
    document.getElementById('d').textContent='00';
    document.getElementById('h').textContent='00';
    document.getElementById('m').textContent='00';
    document.getElementById('s').textContent='00';
    document.getElementById('done').style.display='block';
    document.getElementById('meta').textContent='Tillträdet är nu!';
    return;
  }
  const days = Math.floor(diff/86400000);
  const hours = Math.floor(diff%86400000/3600000);
  const mins = Math.floor(diff%3600000/60000);
  const secs = Math.floor(diff%60000/1000);
  document.getElementById('d').textContent=pad(days);
  document.getElementById('h').textContent=pad(hours);
  document.getElementById('m').textContent=pad(mins);
  document.getElementById('s').textContent=pad(secs);
  const total = target-start;
  const pct = Math.min(100, Math.max(0, ((now-start)/total)*100));
  document.getElementById('bar').style.width=pct.toFixed(1)+'%';
  const weeks = Math.floor(days/7);
  const rest = days%7;
  document.getElementById('meta').textContent = days + ' dagar kvar • ' + weeks + ' veckor och ' + rest + ' dagar kvar • ' + pct.toFixed(1) + '% av väntan har gått';
}
tick(); setInterval(tick,1000);
</script>
</body>
</html>
